name: graveto

services:
  frontend:
    image: ghcr.io/ferreiraman/graveto-web:latest
    container_name: graveto_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      graveto:
        condition: service_healthy

  graveto:
    image: ghcr.io/ferreiraman/graveto:latest
    container_name: graveto_backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "java", "HealthCheckClient.java", "8081"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"
    environment:
      - GRAVETO_POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_APP_USER=${GRAVETO_APP_USER}
      - POSTGRES_APP_PASSWORD=${GRAVETO_APP_PASSWORD}
      - POSTGRES_MIGRATOR_USER=${GRAVETO_MIGRATOR_USER}
      - POSTGRES_MIGRATOR_PASSWORD=${GRAVETO_MIGRATOR_PASSWORD}   
      - YFINANCE_API_KEY=${YFINANCE_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy    

  postgres:
    image: ghcr.io/ferreiraman/graveto-postgres:latest
    container_name: graveto_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]    
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./graveto-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_APP_USER=${GRAVETO_APP_USER}
      - POSTGRES_APP_PASSWORD=${GRAVETO_APP_PASSWORD}
      - POSTGRES_MIGRATOR_USER=${GRAVETO_MIGRATOR_USER}
      - POSTGRES_MIGRATOR_PASSWORD=${GRAVETO_MIGRATOR_PASSWORD}   